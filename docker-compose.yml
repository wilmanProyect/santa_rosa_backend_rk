version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: santa_rosa_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-santa_rosa_db}
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-santa_rosa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - santa_rosa_network

volumes:
  postgres_data:

networks:
  santa_rosa_network:
    driver: bridge
